# Render blueprint: New > Blueprint > pick this repo, then fill in the settings marked sync:false in the dashboard.
services:
  - type: web
    name: seva-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_WORKSPACE_ID
        sync: false
      - key: OFFICER_PASSWORD
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      - key: OFFICER_USER
        value: officer
      - key: MAX_LIVE_ANALYSES_PER_DAY
        value: "40"
